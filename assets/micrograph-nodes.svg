<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6">
  <!-- Sidedoor Digital :: node-triangle mark. Three linked access nodes. -->
  <g stroke-linecap="round">
    <line x1="210" y1="80" x2="110" y2="220" />
    <line x1="210" y1="80" x2="310" y2="220" />
    <line x1="110" y1="220" x2="310" y2="220" />
  </g>
  <circle cx="210" cy="80" r="34" />
  <circle cx="110" cy="220" r="30" />
  <circle cx="310" cy="220" r="30" />
  <circle cx="210" cy="80" r="4" fill="currentColor" stroke="none" />
  <circle cx="110" cy="220" r="4" fill="currentColor" stroke="none" />
  <circle cx="310" cy="220" r="4" fill="currentColor" stroke="none" />
  <text x="210" y="87" font-family="'IBM Plex Mono', monospace" font-size="15" fill="currentColor" stroke="none" text-anchor="middle">S</text>
  <text x="210" y="18" font-family="'IBM Plex Mono', monospace" font-size="13" letter-spacing="3" fill="currentColor" stroke="none" text-anchor="middle">SIDEDOOR</text>
  <text x="210" y="150" font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="1.5" fill="currentColor" stroke="none" text-anchor="middle" opacity="0.7">NODE 01</text>
  <text x="20" y="225" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="1.5" fill="currentColor" stroke="none" opacity="0.7">CONNECTED</text>
  <text x="330" y="225" font-family="'IBM Plex Mono', monospace" font-size="9" letter-spacing="1.5" fill="currentColor" stroke="none" opacity="0.7">DIRECT</text>
</svg>
